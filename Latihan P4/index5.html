<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 5 - To Do List</title>
    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1e293b;
            --panel: rgba(15, 23, 42, 0.75);
            --panel-border: rgba(148, 163, 184, 0.2);
            --text: #e2e8f0;
            --muted: #cbd5e1;
            --input: rgba(15, 23, 42, 0.6);
            --accent: #7dd3fc;
            --accent-strong: #38bdf8;
            --danger: #f87171;
            --success: #34d399;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text);
        }

        .todo-app {
            width: min(92vw, 620px);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 30px 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(10px);
        }

        h1 {
            margin: 0 0 22px;
            text-align: center;
            font-size: clamp(2rem, 4vw, 2.7rem);
            letter-spacing: 1px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 10px;
            background: var(--input);
            color: var(--text);
            font-size: 15px;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: 700;
            cursor: pointer;
        }

        #add-task {
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #082f49;
            min-width: 120px;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .task-left span {
            word-break: break-word;
            color: var(--text);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--success);
            cursor: pointer;
        }

        .delete-btn {
            background: rgba(248, 113, 113, 0.12);
            color: #fecaca;
            padding: 8px 12px;
        }
    </style>
</head>
<body>
    <div class="todo-app">
        <h1>To Do List</h1>
        <div id="output5"></div>
    </div>

    <script src="latihan5.js"></script>
</body>
</html>
