<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 4 - Form Validasi</title>
    <style>
        :root {
            --panel-bg: rgba(12, 18, 38, 0.72);
            --panel-border: rgba(148, 163, 184, 0.25);
            --text-main: #e2e8f0;
            --text-soft: #cbd5e1;
            --accent: #7dd3fc;
            --accent-strong: #38bdf8;
            --input-bg: rgba(15, 23, 42, 0.5);
            --input-border: rgba(148, 163, 184, 0.4);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(56, 189, 248, 0.2), transparent 25%),
                radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.15), transparent 30%),
                linear-gradient(135deg, #020817, #0f172a 35%, #111827 100%);
            color: var(--text-main);
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
            animation: twinkle 3s ease-in-out infinite alternate, drift 18s linear infinite;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.4); }
            100% { opacity: 0.7; transform: scale(1); }
        }

        @keyframes drift {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(90vw, 500px);
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.7);
            padding: 30px 25px;
            backdrop-filter: blur(8px);
        }

        h1 {
            text-align: center;
            margin: 0 0 24px;
            color: var(--text-main);
            font-size: clamp(1.8rem, 3vw, 2.3rem);
            letter-spacing: 1px;
        }

        #output4 {
            display: flex;
            justify-content: center;
        }

        form {
            width: 100%;
        }

        label {
            display: inline-block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-soft);
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin-bottom: 14px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.2);
        }

        button {
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #082f49;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(56, 189, 248, 0.4);
        }

        #error-message {
            margin-top: 16px;
            font-weight: bold;
            min-height: 22px;
            color: #fca5a5;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars" aria-hidden="true"></div>

    <div class="container">
        <h1>Form Validasi</h1>
        <div id="output4"></div>
    </div>

    <script>
        const starsContainer = document.getElementById('stars');
        const starCount = 120;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('span');
            star.className = 'star';
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.opacity = (Math.random() * 0.8 + 0.2).toFixed(2);
            star.style.animationDelay = `${(Math.random() * 3).toFixed(2)}s`;
            star.style.animationDuration = `${(Math.random() * 4 + 2).toFixed(2)}s`;
            starsContainer.appendChild(star);
        }
    </script>

    <script src="latihan4.js"></script>
</body>
</html>
